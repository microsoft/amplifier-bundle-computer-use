name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Deliberately no display server (no Xvfb, no X11). The suite is designed to run
    # headless on Linux with no desktop present, stubbing the platform layer instead of
    # driving a real screen. The coexistence ship gate (scripts/verify_coexistence.py),
    # which DOES need a real X server, is not run here — see CONTRIBUTING.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            anthropic-version: "1.0.0"
            openai-version: "2.9.0"
          - python-version: "3.12"
            anthropic-version: "1.13.0"
            openai-version: "3.29.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # `--clear` is load-bearing: astral-sh/setup-uv already creates `.venv`
      # when given a `python-version`, and a bare `uv venv` then fails with
      # "A virtual environment already exists at: .venv" (exit 2). Verified in
      # CI run 30725123629, which failed this way on both 3.11 and 3.12.
      - name: Create virtual environment
        run: uv venv --clear

      - name: Install modules and test dependencies
        run: |
          uv pip install -e modules/tool-computer-use -e modules/hook-computer-use
          uv pip install -r tests/requirements.txt "anthropic==${{ matrix.anthropic-version }}" "openai==${{ matrix.openai-version }}"
          uv pip check

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Verify release qualification
        if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python -m pytest release_checks/ -q


  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check formatting
        run: uvx ruff@0.16.1 format --check .

      - name: Lint
        run: uvx ruff@0.16.1 check .
