name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Deliberately no display server (no Xvfb, no X11). The suite is designed to run
    # headless on Linux with no desktop present, stubbing the platform layer instead of
    # driving a real screen. The coexistence ship gate (scripts/verify_coexistence.py),
    # which DOES need a real X server, is not run here — see CONTRIBUTING.md.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # `--clear` is load-bearing: astral-sh/setup-uv already creates `.venv`
      # when given a `python-version`, and a bare `uv venv` then fails with
      # "A virtual environment already exists at: .venv" (exit 2). Verified in
      # CI run 30725123629, which failed this way on both 3.11 and 3.12.
      - name: Create virtual environment
        run: uv venv --clear

      - name: Install modules and test dependencies
        run: |
          uv pip install -e modules/tool-computer-use -e modules/hook-computer-use
          uv pip install amplifier-core pytest pytest-asyncio

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q


  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Check formatting
        run: uvx ruff@0.16.1 format --check .

      - name: Lint
        run: uvx ruff@0.16.1 check .
