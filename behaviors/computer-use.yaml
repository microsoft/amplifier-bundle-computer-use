bundle:
  name: computer-use-behavior
  version: 0.1.0
  description: Provider-neutral intent and canonical control of a local or remote Windows, macOS, or Linux desktop

tools:
  - module: tool-computer-use
    source: git+https://github.com/microsoft/amplifier-bundle-computer-use.git@main#subdirectory=modules/tool-computer-use
    config:
      # Full config reference + setup prerequisites: docs/SETUP.md
      #
      # Which desktop to drive. Omit entirely to probe THIS machine
      # (Windows/WSL2 -> Linux X11 -> macOS, first available wins).
      # target: ssh://user@host
      #
      # Screenshots are downscaled to this long edge before the model sees them.
      # These are screenshot pixels; the tool alone maps them to physical pixels.
      max_edge: 1280
      enable_zoom: true
      # read_only is deliberately UNSET here, not set to false: the code's own
      # default (`ComputerTool.__init__`) is false for a local target and TRUE
      # for a remote (ssh://) one - but that smart default only applies when
      # the key is ABSENT. Shipping an explicit `read_only: false` would shadow
      # it permanently, so uncommenting `target: ssh://...` above would silently
      # keep write access on a machine you are not looking at. Set `read_only`
      # explicitly yourself only if you want to override the default in either
      # direction; see docs/SETUP.md \u00a75/\u00a76.
      # Native declarations, model support and vendor unit conversion belong to
      # the provider. This tool exports explicit neutral v1 intent, not a dialect.

hooks:
  - module: hook-computer-use
    source: git+https://github.com/microsoft/amplifier-bundle-computer-use.git@main#subdirectory=modules/hook-computer-use
    config:
      # How many of the most recent screenshots stay inline in the request.
      # Older ones collapse to text so a long session does not blow up cost.
      max_inline_screenshots: 3
      # Allow writes on a gated target with NO human confirmation, when no
      # interactive approval is possible (stdin is not a TTY). Deliberate,
      # always logged at WARNING, never a default. See docs/SETUP.md section 7.
      #
      # This and tool-computer-use's `gate_writes` are two answers to the
      # SAME policy question, not two independent gates: `gate_writes`
      # decides whether `focus_window`/`set_clipboard` need approval at all;
      # this decides how that approval is granted with nobody at a
      # terminal. Set this true and those two actions work on a gated
      # remote target with no prompt. Leave both this and `gate_writes`
      # at their defaults on a remote, non-read_only target and those two
      # actions stay refused until one of: an interactive `ask_user`
      # approval, this set true, or tool-computer-use's `gate_writes: false`.
      # unattended_writes_ok: true

agents:
  include:
    - computer-use:computer-operator

context:
  include:
    - computer-use:context/computer-use-awareness.md
