[project]
name = "amplifier-module-hook-computer-use"
version = "0.1.0"
description = "Generic computer screenshot/error history projection and desktop write/halt policy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.entry-points."amplifier.modules"]
hook-computer-use = "amplifier_module_hook_computer_use:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hook_computer_use"]
