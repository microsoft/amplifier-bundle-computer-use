[project]
name = "amplifier-module-tool-computer-use"
version = "0.1.0"
description = "Provider-neutral canonical computer execution against local or SSH desktops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    # Self-configuring fix: `ComputerUseUnavailableTool` action="persist"
    # (`_persist_target`) reads/writes the user's `~/.amplifier/settings.yaml`.
    "pyyaml>=6.0",
]

[project.entry-points."amplifier.modules"]
tool-computer-use = "amplifier_module_tool_computer_use:mount"

[project.scripts]
# The escape hatch for a durable coexistence halt (see halt_state.py /
# resume_cli.py), reachable from an INSTALLED WHEEL with no repo checkout -
# `scripts/resume_after_halt.py` only works from a full git checkout, which a
# `pip install`/`uv pip install` straight from this module's own
# `source: git+https://...#subdirectory=modules/tool-computer-use` never has.
amplifier-computer-use-resume = "amplifier_module_tool_computer_use.resume_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_computer_use"]

[tool.hatch.build.targets.wheel.force-include]
"amplifier_module_tool_computer_use/bridge.ps1" = "amplifier_module_tool_computer_use/bridge.ps1"
